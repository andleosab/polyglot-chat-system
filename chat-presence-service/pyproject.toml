[project]
name = "chat-presence-service"
version = "0.1.0"
description = "User presence (online/offline/last-seen) and typing indicators"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
