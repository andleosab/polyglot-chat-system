name: chat-presence-service

services:
  chat-presence-service:
    image: chat-presence-service
    container_name: chat-presence-service
    ports:
      - "8300:8000"
      - "50051:50051"
    env_file:
      - ${ENV_FILE:-.env.docker}
    networks:
      - chat-demo-net

networks:
  chat-demo-net:
    external: true
