image:
  repository: ""  # set via --set image.repository=... in CI
  tag: "latest"

service:
  port: 8080

env:
  - name: HTTP_PORT
    value: "8080"
  - name: KAFKA_BROKERS
    value: "redpanda.chat.svc.cluster.local:9092"
  - name: JWT_ISSUER
    value: "chat-web,chat-delivery-service"
  - name: JWT_AUDIENCE
    value: "chat-message-service"

secretName: chat-secrets
secretEnv:
  - envName: JWT_SECRET
    secretKey: jwt-secret
  - envName: DATABASE_URL
    secretKey: db-url-message

# Runs golang-migrate against the message DB before the main container starts.
# Both the binary and the migration SQL files are baked into the image
# (see chat-message-service/docker/Dockerfile).
migrate:
  enabled: true
  command:
    - sh
    - -c
    - /app/migrate -path /app/migrations -database "$DATABASE_URL" up

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "300m"
    memory: "128Mi"
