image:
  repository: ""  # set via --set image.repository=... in CI
  tag: "latest"

service:
  port: 3000

env:
  - name: PORT
    value: "3000"
  - name: USER_API_BASE
    value: "http://chat-user-service.chat.svc.cluster.local:8080/user"
  - name: MESSAGE_API_BASE
    value: "http://chat-message-service.chat.svc.cluster.local:8080/messaging"
  - name: PRESENCE_API_BASE
    value: "http://chat-presence-service.chat.svc.cluster.local:8000"
  # BETTER_AUTH_URL, ORIGIN, PUBLIC_DELIVERY_API_BASE depend on the node's external IP.
  # Update after `terraform apply` once `kubectl get nodes -o wide` reveals the IP,
  # then commit — the chat-web deploy workflow picks it up.
  - name: BETTER_AUTH_URL
    value: "http://REPLACE_WITH_NODE_EXTERNAL_IP:30080"
  - name: ORIGIN
    value: "http://REPLACE_WITH_NODE_EXTERNAL_IP:30080"
  - name: PUBLIC_DELIVERY_API_BASE
    value: "ws://REPLACE_WITH_NODE_EXTERNAL_IP:30080/chat"

secretName: chat-secrets
secretEnv:
  - envName: JWT_SECRET
    secretKey: jwt-secret
  - envName: BETTER_AUTH_SECRET
    secretKey: better-auth-secret
  - envName: DATABASE_URL
    secretKey: db-url-auth

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "450Mi"
