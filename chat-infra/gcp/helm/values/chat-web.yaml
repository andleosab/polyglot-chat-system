image:
  repository: ""  # set via --set image.repository=... in CI
  tag: "latest"

service:
  port: 3000

env:
  - name: PORT
    value: "3000"
  - name: USER_API_BASE
    value: "http://chat-user-service.chat.svc.cluster.local:8080/user"
  - name: MESSAGE_API_BASE
    value: "http://chat-message-service.chat.svc.cluster.local:8080/messaging"
  - name: PRESENCE_API_BASE
    value: "http://chat-presence-service.chat.svc.cluster.local:8000"
  # BETTER_AUTH_URL and ORIGIN must match the origin the BROWSER uses. They are read at
  # runtime and cannot cover two origins at once, so pick one way in and use it for both:
  #
  #   NodePort      http://<node external IP>:30080  — `kubectl get nodes -o wide`.
  #                 The node is Spot, so this IP changes on preemption.
  #   port-forward  http://localhost:8080            — `kubectl port-forward svc/nginx
  #                 8080:80 -n chat`. Forward nginx, not chat-web: the browser needs / and
  #                 the /chat/ WebSocket on one origin, and nginx is what joins them.
  #                 Also immune to the Spot IP churn.
  #
  # Commit after editing — the chat-web deploy workflow picks it up.
  - name: BETTER_AUTH_URL
    value: "http://localhost:8080"
  - name: ORIGIN
    value: "http://localhost:8080"
  # PUBLIC_DELIVERY_API_BASE is deliberately absent. ws.ts reads it only under
  # import.meta.env.DEV, and it is a $env/static/public import — baked in at build time,
  # so a runtime value here could never reach the bundle anyway. In production the
  # WebSocket URL is derived from location.host, so it follows whichever origin you
  # choose above, automatically. Set it in chat-web's local env for `pnpm dev`, not here.

secretName: chat-secrets
secretEnv:
  - envName: JWT_SECRET
    secretKey: jwt-secret
  - envName: BETTER_AUTH_SECRET
    secretKey: better-auth-secret
  - envName: DATABASE_URL
    secretKey: db-url-auth
  # Empty unless google_client_id / google_client_secret are set in terraform.tfvars.
  # Empty means Google sign-in fails with the message the sign-in page already shows;
  # email/password is unaffected.
  - envName: GOOGLE_CLIENT_ID
    secretKey: google-client-id
  - envName: GOOGLE_CLIENT_SECRET
    secretKey: google-client-secret

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "450Mi"
