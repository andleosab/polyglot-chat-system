image:
  repository: ""  # set via --set image.repository=... in CI
  tag: "latest"

service:
  port: 8080

javaToolOptions: "-Xms64m -Xmx256m"

env:
  - name: SERVER_PORT
    value: "8080"
  # Spring's relaxed binding maps DB_URL → property db.url etc., so application.yaml's
  # ${db.url} placeholders still resolve. Using underscored names sidesteps the kubelet
  # env-var-name validator, which rejects dots by default on GKE < 1.34.
  - name: DB_URL
    value: "jdbc:postgresql://postgres.chat.svc.cluster.local:5432/chat-user"
  - name: DB_USERNAME
    value: "postgres"
  - name: KAFKA_BOOTSTRAP
    value: "redpanda.chat.svc.cluster.local:9092"

secretName: chat-secrets
secretEnv:
  - envName: JWT_SECRET
    secretKey: jwt-secret
  - envName: DB_PASSWORD
    secretKey: postgres-password

# Startup takes ~65s under these CPU limits. Liveness and readiness stay suspended
# until this passes, so a slow boot cannot trip the restart loop.
startupProbe:
  httpGet:
    path: /user/actuator/health
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30
readinessProbe:
  httpGet:
    path: /user/actuator/health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
livenessProbe:
  httpGet:
    path: /user/actuator/health
    port: http
  periodSeconds: 10
  timeoutSeconds: 3

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "350Mi"
