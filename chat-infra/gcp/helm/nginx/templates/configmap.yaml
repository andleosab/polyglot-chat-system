apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  # Rendered by the image's 20-envsubst-on-templates.sh into /etc/nginx/conf.d/default.conf.
  # Only ${NGINX_LOCAL_RESOLVERS} is substituted — envsubst is passed the list of defined
  # env vars, so nginx's own $host/$http_upgrade/etc. pass through untouched.
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
      listen 80;

      # Both upstreams are deployed later than this chart (README step 10 vs step 7), and
      # nginx resolves upstream names at config-parse time — it refuses to start on an
      # unknown host, which made `helm --wait` fail step 7 before the apps could exist.
      # A resolver plus variables in proxy_pass defers lookup to request time: nginx now
      # starts regardless and serves 502 until the services appear. NGINX_LOCAL_RESOLVERS
      # is set from /etc/resolv.conf by the image's 15-local-resolvers.envsh.
      # Neither proxy_pass specifies a URI component, so the original request URI is
      # still passed through verbatim — including the /chat/ prefix.
      resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

      location / {
        set $web_upstream chat-web.{{ .Release.Namespace }}.svc.cluster.local;
        proxy_pass http://$web_upstream:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /chat/ {
        set $delivery_upstream chat-delivery-service.{{ .Release.Namespace }}.svc.cluster.local;
        proxy_pass http://$delivery_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_buffering off;
      }
    }
