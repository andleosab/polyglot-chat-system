apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
      listen 80;

      # Both upstreams are deployed later than this chart (README step 10 vs step 7), and
      # nginx resolves upstream names at config-parse time — it refuses to start on an
      # unknown host, which made `helm --wait` fail step 7 before the apps could exist.
      # A resolver plus variables in proxy_pass defers lookup to request time: nginx now
      # starts regardless and serves 502 until the services appear.
      # Neither proxy_pass specifies a URI component, so the original request URI is
      # still passed through verbatim — including the /chat/ prefix.
      # kube-dns is named, not an IP: resolver has accepted domain names since nginx
      # 1.2.2, and the pod's own /etc/resolv.conf resolves this at startup. Do not
      # substitute the image's ${NGINX_LOCAL_RESOLVERS} here — it is not exported into
      # the envsubst step's environment, so it arrives as an unexpanded literal.
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;

      location / {
        set $web_upstream chat-web.{{ .Release.Namespace }}.svc.cluster.local;
        proxy_pass http://$web_upstream:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /chat/ {
        set $delivery_upstream chat-delivery-service.{{ .Release.Namespace }}.svc.cluster.local;
        proxy_pass http://$delivery_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_buffering off;
      }
    }
