apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      # The PD's root dir is root:root and this image runs unprivileged, so it cannot
      # create pid.lock in the mount:
      #   application.cc:470 - Failure during startup: system:13, open: Permission denied
      # postgres/redis avoid this because their images start as root and chown the data
      # dir via gosu before dropping privileges; redpanda's never runs as root. fsGroup
      # makes the kubelet chown the volume to this gid AND add it to the process's
      # supplementary groups, so the two agree without hardcoding the image's uid.
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # MUST be args:, not command:. The image ENTRYPOINT is /usr/bin/rpk, and in
          # Kubernetes command: replaces the ENTRYPOINT — unlike compose, where command:
          # replaces only CMD. Under command: the "redpanda" below resolves to the C++
          # broker binary rather than "rpk redpanda", and every rpk flag is rejected:
          #   cli_parser.cc:46 - Argument parse error: unrecognised option '--node-id'
          # cli_parser.cc is the broker's own parser; it owns only the seastar flags
          # (--smp/--memory/--reserve-memory), which is why those parsed and the rest
          # did not. docker-compose.yml runs these same flags fine because it inherits
          # the entrypoint.
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=600M
            - --reserve-memory=0M
            # No --node-id: v24.1.2 assigns broker IDs automatically at bootstrap.
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda.{{ .Release.Namespace }}.svc.cluster.local:9092
            # Redpanda defaults this to false (unlike Kafka). No service creates its
            # topics programmatically, so without it the first produce to chat.messages
            # fails with UNKNOWN_TOPIC_OR_PARTITION while every pod still reports healthy.
            - --set
            - redpanda.auto_create_topics_enabled=true
          ports:
            - containerPort: 9092
              name: kafka
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redpanda-pvc
