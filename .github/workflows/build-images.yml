name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: us-west1-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPO: chat-demo

jobs:
  build-and-deploy:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: chat-web
            context: chat-web
            dockerfile: chat-web/Dockerfile
          - name: chat-user-service
            context: chat-user-service
            dockerfile: chat-user-service/Dockerfile
          - name: chat-message-service
            context: chat-message-service
            dockerfile: chat-message-service/docker/Dockerfile
          - name: chat-delivery-service
            context: chat-delivery-service
            dockerfile: chat-delivery-service/src/main/docker/Dockerfile.jvm.builder
          - name: chat-presence-service
            context: .
            dockerfile: chat-presence-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service.name }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: chat-demo
          location: us-west1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy ${{ matrix.service.name }}
        run: |
          helm upgrade --install ${{ matrix.service.name }} \
            ./chat-infra/gcp/helm/microservice \
            -f ./chat-infra/gcp/helm/values/${{ matrix.service.name }}.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service.name }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --namespace chat \
            --wait \
            --timeout 5m
