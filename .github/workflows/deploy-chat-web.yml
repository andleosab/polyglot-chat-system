name: Deploy chat-web

on:
  push:
    branches: [main]
    paths:
      - 'chat-web/**'
      - 'chat-infra/gcp/helm/values/chat-web.yaml'
      - 'chat-infra/gcp/helm/microservice/**'
  workflow_dispatch:

env:
  REGISTRY: us-west1-docker.pkg.dev
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REPO: chat-demo
  SERVICE: chat-web

permissions:
  contents: read   # actions/checkout
  id-token: write  # mint the OIDC token for Workload Identity Federation

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # chat-web/Dockerfile copies .env.local.docker to .env.production so that
      # SvelteKit can resolve its $env/static/* imports, which are inlined at build
      # time. That file is gitignored (chat-web/.gitignore: `.env.*`), so it exists
      # only on a developer machine and the CI build fails without it:
      #   COPY .env.local.docker .env.production -> "/.env.local.docker": not found
      #
      # Only these three names are read statically — PUBLIC_DELIVERY_API_BASE in
      # ws.ts and the two Google keys in auth.ts. Everything that varies per
      # environment (BETTER_AUTH_SECRET, DATABASE_URL, the API bases) is read through
      # $env/dynamic/private at runtime and comes from the chat-secrets Secret and the
      # Helm values, so nothing sensitive is baked into the image here.
      #
      # PUBLIC_DELIVERY_API_BASE's value is irrelevant to the deployed app: ws.ts uses
      # it only under import.meta.env.DEV, and production derives the socket URL from
      # location.host. It needs to exist, not to be correct.
      - name: Write build-time env for SvelteKit static imports
        run: |
          cat > chat-web/.env.local.docker <<'ENV'
          PUBLIC_DELIVERY_API_BASE=ws://localhost/chat
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: chat-web
          file: chat-web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.17.0"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: chat-demo
          location: us-west1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy
        run: |
          helm upgrade --install ${{ env.SERVICE }} \
            ./chat-infra/gcp/helm/microservice \
            -f ./chat-infra/gcp/helm/values/${{ env.SERVICE }}.yaml \
            --set image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --namespace chat \
            --wait \
            --timeout 5m
